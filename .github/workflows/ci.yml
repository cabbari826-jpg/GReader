name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q app.py ordertool tests
      - name: Run unit tests
        run: python -m pytest -q
      - name: Smoke-test desktop window construction
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from ordertool.gui import MainWindow; app=QApplication([]); w=MainWindow(); assert w is not None; w.close(); app.quit()"
